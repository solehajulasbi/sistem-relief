function tempPw(){const c='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function authMsg(e){const c=(e&&e.code)||'';
  if(/wrong-password|user-not-found|invalid-credential|invalid-login|invalid-email/.test(c))return 'Nama pengguna atau kata laluan salah.';
  if(/too-many-requests/.test(c))return 'Terlalu banyak cubaan. Akaun disekat sementara, cuba lagi selepas beberapa minit.';
  if(/network/.test(c))return 'Tiada sambungan internet.';
  if(/unauthorized-domain/.test(c))return 'Domain laman ini belum dibenarkan dalam Firebase (Authorized domains).';
  if(/operation-not-allowed/.test(c))return 'Log masuk nama pengguna belum dihidupkan dalam Firebase (Email/Password).';
  return (e&&e.message)||String(e);}

const FB_STEPS=["Buka console.firebase.google.com dan log masuk dengan akaun Google admin. Tekan Add project (percuma).", "Dalam projek: Build > Authentication > Get started. Hidupkan Google, kemudian Email/Password (suis pertama sahaja). Simpan.", "Authentication > Settings > Authorized domains: tambah domain laman anda (cth namaanda.github.io).", "Build > Firestore Database > Create database. Pilih Standard edition, lokasi asia-southeast1 (Singapore) dan Production mode.", "Firestore > Rules: padam semua, tampal peraturan di bawah, kemudian tekan Publish.", "Project settings > General > Your apps > Web (</>): daftar app, salin objek firebaseConfig dan tampal di bawah."];
const FB_RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /schools/{sid} {
      function em() { return request.auth.token.email.lower(); }
      function memPath() { return /databases/$(database)/documents/schools/$(sid)/members/$(em()); }
      function ownPath() { return /databases/$(database)/documents/schools/$(sid)/owner/info; }
      function isMember() { return request.auth != null && exists(memPath()); }
      function role() { return get(memPath()).data.role; }
      function isStaff() { return isMember() && role() in ['admin', 'penyelaras']; }
      function isAdmin() { return isMember() && role() == 'admin'; }
      match /owner/{doc} {
        allow read: if request.auth != null;
        allow create: if request.auth != null && doc == 'info' && !exists(ownPath()) && request.resource.data.uid == request.auth.uid;
      }
      match /members/{email} {
        allow read: if isAdmin() || (request.auth != null && email == em());
        allow create: if isAdmin() || (request.auth != null && email == em() && request.resource.data.role == 'admin' && get(ownPath()).data.uid == request.auth.uid);
        allow update: if isAdmin() || (request.auth != null && email == em() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['mustChange']) && request.resource.data.mustChange == false);
        allow delete: if isAdmin();
      }
      match /logins/{username} {
        allow read: if true;
        allow create: if isAdmin() || (request.auth != null && !exists(/databases/$(database)/documents/schools/$(sid)/logins/$(username)) && request.resource.data.email == em());
        allow update, delete: if isAdmin();
      }
      match /requests/{email} {
        allow read: if isAdmin() || (request.auth != null && email == em());
        allow create: if request.auth != null && email == em() && request.resource.data.email == em();
        allow delete: if isAdmin() || (request.auth != null && email == em());
      }
      match /meta/{doc} { allow read: if isMember(); allow write: if isStaff(); }
      match /tt/{doc} { allow read: if isMember(); allow write: if isStaff(); }
      match /days/{doc} { allow read: if isMember(); allow write: if isStaff(); }
    }
  }
}`;
/* Paparan guru: relief dan jadual sendiri */
function viewSaya(date){
  const tid=cloud.teacher;
  if(!tid||!state.teachers[tid])return '<div class="panel"><div class="empty">Akaun anda belum dipautkan kepada nama guru. Minta admin pautkan di Tetapan &gt; Akaun &amp; Ahli.</div></div>';
  const c=build(date),D=c.D,dw=c.dw;
  if(!dw)return '<div class="panel"><div class="empty">Tiada sesi persekolahan pada '+esc(dayName(date))+'.</div></div>';
  const rel=[],buy=c.swapped.filter(w=>w.to===tid);
  for(const k in D.asg){const v=D.asg[k];if(v.r===tid)rel.push(v);}
  rel.sort((a,b)=>a.p-b.p);
  const abs=c.absent[tid];
  let h='<section class="panel"><header><div><h2>'+esc(tName(tid))+'</h2><span class="muted">'+esc(dayName(date))+', '+esc(dateLong(date))+'</span></div><span class="tag '+(rel.length?'warn':'ok')+'">'+rel.length+' relief</span></header><div class="body">';
  if(abs)h+='<div class="note warn">Anda direkodkan tidak hadir ('+esc(abs.reason||'')+').</div>';
  if(!D.saved&&!rel.length)h+='<p class="muted" style="margin-top:0">Senarai relief untuk tarikh ini belum disimpan oleh penyelaras.</p>';
  h+=(rel.length||buy.length)?'<ul class="list">'+rel.map(v=>'<li><span><b>'+esc(tstr(v.p))+'</b> &middot; '+esc(v.cls||'-')+' '+esc(subjShort(v.subj)||'')+'</span><span class="tag blue">ganti '+esc(sName(v.a))+'</span></li>').join('')+buy.map(w=>'<li><span><b>'+esc(tstr(w.p))+'</b> &middot; '+esc(w.cls||'-')+' '+esc(subjShort(w.subj)||'')+'</span><span class="tag">jual/beli dari '+esc(sName(w.from))+'</span></li>').join('')+'</ul>':'<div class="empty">Tiada relief untuk anda pada tarikh ini.</div>';
  h+='</div></section><section class="panel"><header><h2>Jadual saya hari ini</h2></header><div class="body"><ul class="list">';
  state.settings.periods.forEach(p=>{
    const r=rel.find(v=>v.p===p.n),b=c.busy[tid]&&c.busy[tid][p.n];
    let what='<span class="muted">Kosong</span>';
    if(c.isAbs(tid,p.n))what='<span class="muted">Tidak hadir</span>';
    else if(r)what='<b>Relief</b> '+esc(r.cls||'-')+' ('+esc(sName(r.a))+')';
    else if(b)what=esc(b.c?(b.c+' '+subjShort(b.s||'')):(b.a||''))+(b.kind==='buy'?' <span class="tag">jual/beli</span>':'');
    else if(pickupBlocked(tid,dw,p.n))what='<span class="muted">Ambil anak</span>';
    h+='<li><span style="min-width:110px">'+esc(tstr(p.n))+'</span><span style="flex:1">'+what+'</span></li>';
  });
  return h+'</ul></div></section>';
}

  addAsm:'Tambah perhimpunan',delAsm:'Padam perhimpunan',addSubj:'Simpan kod subjek',delSubj:'Padam kod subjek',reset:'Padam semua data'};

function logSnap(){const l=state.log,u=state.ui;state.log=null;state.ui=null;const s=JSON.stringify(state);state.log=l;state.ui=u;return s;}
function logBefore(n,el){const D=dayRO(state.ui.date),i=el&&el.dataset?+el.dataset.i:-1;
  if(n==='delAbsent'&&D.absent[i])return tName(D.absent[i].t);
  if(n==='delNR'&&D.noRelief[i])return tName(D.noRelief[i].t);
  if(n==='delProg'&&D.prog[i])return D.prog[i].name||D.prog[i].venue||'Program';
  if(n==='delSwap'&&D.swaps[i])return tName(D.swaps[i].from)+' kepada '+tName(D.swaps[i].to)+', waktu '+D.swaps[i].p;
  if(n==='delAsm'&&state.settings.assembly[i])return DAYS[state.settings.assembly[i].d]+', waktu '+state.settings.assembly[i].p;
  if(n==='delSubj'&&state.settings.subjCodes[i])return state.settings.subjCodes[i].full;
  if(n==='delLeave'){const x=state.leave.find(y=>y.id===el.dataset.id);return x?tName(x.t)+', '+x.from+' hingga '+x.to:'';}
  if(n==='delCover'){const x=state.cover.find(y=>y.id===el.dataset.id);return x?tName(x.ros)+' untuk '+tName(x.orig):'';}
  if(n==='addAsm')return DAYS[+$v('asmDay')]+', waktu '+$v('asmPer');
  if(n==='addSubj')return $v('subjFull').trim()+' = '+$v('subjCode').trim();
  return '';}
function logDetail(n,el,pre){const date=state.ui.date,ds=el&&el.dataset||{},D=dayRO(date),last=a=>a&&a.length?a[a.length-1]:null;
  if(pre)return (['delAsm','delSubj','addAsm','addSubj','delLeave','delCover'].includes(n)?'':date+': ')+pre;
  if(n==='swPaid'){const D=state.days[el.dataset.d],w=D&&D.swaps[+el.dataset.i];return w?el.dataset.d+': '+tName(w.from)+' kepada '+tName(w.to)+', waktu '+w.p+' = '+(w.paid?'sudah dibayar':'belum dibayar'):'';}
  if(n==='swPaidAll')return ui.rek?monthLabel(ui.rek.month):'';
  if(n==='rekCsv')return ui.rek?(ui.rek.sub==='gg'?'Guru ganti':'Jual/beli')+', '+monthLabel(ui.rek.month):'';
  if(n==='addLeave'){const x=last(state.leave);return x?tName(x.t)+' ('+x.reason+'), '+x.from+' hingga '+x.to:'';}
  if(n==='addCover'){const x=last(state.cover);return x?tName(x.ros)+' mengajar kelas '+tName(x.orig)+', '+x.from+' hingga '+x.to:'';}
  if(n==='addTeacherManual'){const t=Object.values(state.teachers).filter(x=>x.manual).sort((a,b)=>b.ord-a.ord)[0];return t?t.name:'';}
  if(n==='leaveTo'||n==='coverTo')return el.value;
  if(n==='addAbsent'){const a=last(D.absent);return a?date+': '+tName(a.t)+(a.reason?' ('+a.reason+')':''):date;}
  if(n==='addNR'){const a=last(D.noRelief);return a?date+': '+tName(a.t)+(a.mode==='range'?', waktu '+a.from+' hingga '+a.to:', sepanjang hari'):date;}
  if(n==='addProg'){const a=last(D.prog);return a?date+': '+(a.name||a.venue||'Program'):date;}
  if(n==='addSwap'){const a=last(D.swaps);return a?date+': '+tName(a.from)+' kepada '+tName(a.to)+', waktu '+a.p:date;}
  if(n==='tGroup'||n==='tCat')return tName(ds.t)+': '+(el.value||'(tiada)');
  if(n==='tShort')return tName(ds.t)+': '+(el.value||'(automatik)');
  if(['deactivateTeacher','activateTeacher','unleaveTeacher','delGroup','delCat','delPickup','delShared'].includes(n))return tName(ds.t);
  if(n==='set')return (ds.path||'').replace(/^settings\.|^school\./,'')+' = '+(el.type==='checkbox'?(el.checked?'ya':'tidak'):el.value);
  if(n==='restSet')return 'Tingkatan '+ds.f+', '+DAYS[+ds.d]+': '+(el.value?'waktu '+el.value:'tiada');
  if(['saveDay','editDay','refreshDay','undoRefresh','auto','clearAsg','word','print','wa','png'].includes(n))return date;
  return '';}
function wrapLog(obj,n,label,always){const f=obj[n];if(typeof f!=='function')return;
  obj[n]=function(el){let before=null,pre='';
    try{if(!always)before=logSnap();pre=logBefore(n,el);}catch(x){}
    const r=f.apply(this,arguments);
    try{if(always||logSnap()!==before){logAct(label,logDetail(n,el,pre));save();if(ui.tab==='tetapan')render();}}catch(x){}
    return r;};}
Object.keys(LOG_A).forEach(n=>wrapLog(A,n,LOG_A[n],false));
Object.keys(LOG_ALWAYS).forEach(n=>wrapLog(A,n,LOG_ALWAYS[n],true));
Object.keys(LOG_C).forEach(n=>wrapLog(C,n,LOG_C[n],false));
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();if(isGuru()&&!GURU_OK.has(el.dataset.act)){toast('Akaun guru hanya boleh melihat.','err');return;}f(el,e);}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(!el)return;const f=C[el.dataset.chg];if(f){if(isGuru()&&!GURU_OK.has(el.dataset.chg)){setTimeout(render,0);return;}setTimeout(()=>f(el,e),0);}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.inp==='gq'){ui.gq=el.value;render();}if(el.dataset&&el.dataset.inp==='rekQ'&&ui.rek){ui.rek.q=el.value;render();}if(el.dataset&&el.dataset.inp==='bq'){ui.bq=el.value;render();}});

/* ---- mouse drag and drop (desktop). Ketik untuk telefon. ---- */
let dragKey='';
document.addEventListener('dragstart',e=>{
  const el=e.target.closest&&e.target.closest('.rc[data-k]');if(!el)return;
  dragKey=el.dataset.k;
  try{e.dataTransfer.setData('text/plain',dragKey);e.dataTransfer.effectAllowed='move';}catch(x){}
  const date=state.ui.date,c=build(date),s=c.needed.find(n=>n.key===dragKey);if(!s)return;
  const ctx={week:weekCounts(date)},D=c.D;
  document.querySelectorAll('td.drop').forEach(td=>{
    td.classList.remove('ok','warn','no');
    if(+td.dataset.p!==s.p){td.classList.add('dim');return;}
    const t=state.teachers[td.dataset.t];if(!t)return;
    const a=assess(c,t,s,D.asg,ctx);
    td.classList.add(a.hard.length?'no':(a.limits.length?(state.settings.strict?'no':'warn'):'ok'));
    td.title=a.hard.concat(a.limits).join('; ');
  });
});
document.addEventListener('dragover',e=>{
  if(!dragKey)return;
  const td=e.target.closest&&e.target.closest('td.drop.ok, td.drop.warn'),pool=e.target.closest&&e.target.closest('[data-drop-pool]');
  if(td||pool){e.preventDefault();try{e.dataTransfer.dropEffect='move';}catch(x){}}
});
document.addEventListener('drop',e=>{
  if(!dragKey)return;
  const td=e.target.closest&&e.target.closest('td.drop.ok, td.drop.warn'),pool=e.target.closest&&e.target.closest('[data-drop-pool]');
  const k=dragKey;dragKey='';
  if(td){e.preventDefault();dropAssign(state.ui.date,k,td.dataset.t);}
  else if(pool){e.preventDefault();const D=dayRW(state.ui.date);if(D.asg[k]){pushUndo(state.ui.date);delete D.asg[k];}ui.moving='';commit();}
});
document.addEventListener('dragend',()=>{dragKey='';document.querySelectorAll('td.drop').forEach(td=>td.classList.remove('ok','warn','no','dim'));});
setInterval(()=>{if((ui.tab==='semasa'||(ui.tab==='jadual'&&ui.sub.jadual==='semasa'))&&ui.live&&ui.live.mode==='now'&&!document.hidden){const a=document.activeElement;if(a&&a.tagName==='SELECT')return;render();}},30000);

window.__relief={silentUpdate,get updPending(){return updPending;},checkUpdate,APP_VERSION,cloud,cloudBoot,get state(){return state;},build,rankSlot,computeAll,autoAssign,finalCheck,parseCSV,prepImport,runImport,activateImport,applyPreset,assess,teachInfo,weekCounts,totalCounts,render,dropAssign,pushUndo,parseActivity,isNoRelief,setState(s){state=ttBind(s);}};
cloudBoot();
